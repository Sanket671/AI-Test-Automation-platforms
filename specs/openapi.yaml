openapi: 3.0.3
info:
  title: Demo User API
  version: 1.0.0
servers:
  - url: http://127.0.0.1:5001
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: API is healthy
  /users:
    get:
      summary: List users
      responses:
        '200':
          description: User list
    post:
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: Test User
      responses:
        '201':
          description: User created
  /users/{user_id}:
    get:
      summary: Get user
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User found
        '404':
          description: User not found
