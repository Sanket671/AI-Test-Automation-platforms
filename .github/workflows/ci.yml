name: API Test Automation CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -q

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node test tooling
        run: npm ci

      - name: Start sample API
        run: |
          nohup python sample_api.py > sample-api.log 2>&1 &
          sleep 3
          curl --fail http://127.0.0.1:5001/health

      - name: Run Newman regression suite
        run: |
          npm run test:newman

      - name: Run Cypress API tests
        uses: cypress-io/github-action@v6
        with:
          install: false
          command: npm run test:cypress
